site_name: Study Notes
site_description: SQLD · ADsP · Python 알고리즘 · CS 학습 노트
site_author: Study Notes

theme:
  name: readthedocs

nav:
  - 홈: index.md
  - 자격증:
      - SQLD:
          - 1과목:
              - 1장:
                  - 데이터 모델링의 이해: sqld/data-modeling.md
                  - 엔터티: sqld/entity.md
                  - 속성: sqld/Attribute.md
                  - 관계: sqld/relationship.md
                  - 식별자: sqld/Identifier.md
              - 2장:
                  - 정규화: sqld/normalization.md
                  - 반정규화: sqld/denormalization.md
                  - 트랜잭션: sqld/Transaction.md
                  - 'NULL': sqld/null.md
                  - 본질식별자와 인조식별자: sqld/identifier-types.md
      - ADsP: adsp/index.md
  - Python:
      - BFS와 DFS: python/bfs-dfs.md
  - CS:
      - 개요: cs/index.md

markdown_extensions:
  - admonition
  - fenced_code
  - tables
  - toc:
      permalink: true
